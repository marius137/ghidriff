[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [
    "ghidriff/basic-block-fix.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E711",
    "E712",
    "E722",
    "F401",
    "F403",
    "F405",
    "F541",
    "F841",
    "W291",
    "W292",
    "W293",
]

[tool.ruff.format]
quote-style = "single"
